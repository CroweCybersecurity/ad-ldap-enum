[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-ldap-enum"
version = "3.0.0"
description = "Active Directory LDAP enumerator using msldap with Impacket-style target syntax."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Crowe LLP" }]

dependencies = [
  "msldap>=0.5.15,<0.6.0",
  "openpyxl>=3.1.2,<4.0",
]

[project.scripts]
ad-ldap-enum = "adldapenum.cli:run"

[tool.setuptools.packages.find]
include = ["adldapenum*"]
