[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-ldap-enum"
version = "3.0"
description = "Active Directory LDAP enumerator using msldap with Impacket-style target syntax."
readme = { text = "Active Directory LDAP enumerator that supports NTLM and Kerberos schemes via msldap and easy output formats." }
requires-python = ">=3.10"
authors = [{ name = "Crowe LLP" }]

dependencies = [
  "msldap>=0.5.15,<0.6.0",
  "openpyxl>=3.1.2,<4.0",
]

[tool.setuptools]
py-modules = ["ad_ldap_enum"]
